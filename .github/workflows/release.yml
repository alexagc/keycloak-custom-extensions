name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release originates from main branch
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tags can only be created from commits merged into the 'main' branch."
            exit 1
          fi
          echo "Verified: commit is on the 'main' branch."

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Package all extensions
        run: mvn -B clean package -DskipTests

      - name: Stage JAR files for release
        run: |
          mkdir -p release-assets
          find extensions -name "*.jar" ! -name "*sources.jar" ! -name "*javadoc.jar" -exec cp {} release-assets/ \;
          echo "Staged release artifacts:"
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*.jar
          generate_release_notes: true
